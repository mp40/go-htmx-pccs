{{ define "modal" }}
<div class="modal-div">
    <button class="modal-close" hx-on:click="this.closest('.modal-container-div').innerHTML = ''">&times;</button>
    <form hx-post="/account/sign-in">
        <label for="email">Email</label>
        <input type="email" name="email">
        <label for="password">Password</label>
        <input type="password" name="password" minlength="3">
        <input class="page-button-grey" type="submit">
    </form>
</div> 
{{ end }}
