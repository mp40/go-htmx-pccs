{{ define "character" }}
<div class="character">
  <span>{{ .Name }}</span>
  <span>{{ .Str }}</span>
  <span>{{ .Int }}</span>
  <span>{{ .Wil }}</span>
  <span>{{ .Hlt }}</span>
  <span>{{ .Agi }}</span>
  <span>{{ .Tch }}</span>
  <span>{{ .GunCombatLevel }}</span>
  <span>{{ .HandToHandLevel }}</span>
  <span
    ><button hx-trigger="click" hx-put="/account/characters/{{ .ID }}/edit">
      Edit
    </button>
  </span>
</div>
{{ end }}
