{{ define "equipment" }}
<div class="equipment">
  <h2>Equipment</h2>
  <div>
    <div class="equipment-heading">
      <span>Name</span>
      <span>Weight</span>
    </div>
    {{range .Equipment}}
    <div>
      <span>{{.Name}}</span>
      <span>{{.Weight}}</span>
    </div>
    {{end}}
  </div>
</div>
{{ end }}
