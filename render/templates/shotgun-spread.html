{{ define "shotgun-spread" }}
<div class="shotgun-spread">
  <h2>Additional Pellet Hits</h2>
  <form hx-get="/tools/shotguns/spread" hx-target="#spread-result">
    <div>
      <label for="initial-location">Initial Location:</label>
      <input
        id="initial-location"
        name="initialLocation"
        type="number"
        value="50"
        min="0"
        max="999"
      />
    </div>
    <div>
      <label for="salm">SALM:</label>
      <input id="salm" name="salm" type="number" value="0" min="-20" max="20" />
    </div>
    <div>
      <label for="hit-count">Additional Hits:</label>
      <input
        id="hit-count"
        name="hitCount"
        type="number"
        value="1"
        min="1"
        max="50"
      />
    </div>
    <button>Calculate</button>
  </form>
  <div id="spread-result"></div>
</div>
{{ end }}
