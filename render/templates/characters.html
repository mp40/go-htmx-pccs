{{ define "characters" }}
<div hx-ext="response-targets" class="characters">
  <h2>Characters</h2>
  <button
    hx-trigger="click"
    hx-post="/account/characters"
    hx-vals='{"str": "10", "int": "10", "wil": "10", "hlt": "10", "agi": "10", "tch": "10", "gun_combat_learning_points": "0", "hand_to_hand_learning_points": "0"}'
    hx-target=".character-container"
    hx-target-500=".add-character-error"
    hx-target-400=".add-character-error"
    hx-swap="beforeend"
  >
    Add Basic
  </button>
  <button
    hx-trigger="click"
    hx-post="/account/characters"
    hx-vals='{"str": "14", "int": "10", "wil": "10", "hlt": "10", "agi": "12", "tch": "10", "gun_combat_learning_points": "16", "hand_to_hand_learning_points": "4"}'
    hx-target=".character-container"
    hx-target-500=".add-character-error"
    hx-target-400=".add-character-error"
    hx-swap="beforeend"
  >
    Add Grunt
  </button>
  <div class="characters-container">
    <div class="fade"></div>
    <div class="character-container">
      <div class="character-heading">
        <span>Name</span>
        <span>STR</span>
        <span>INT</span>
        <span>WIL</span>
        <span>HLT</span>
        <span>AGI</span>
        <span>TCH</span>
        <span>Gun</span>
        <span>Melee</span>
      </div>
      {{range .Characters}} {{ template "character" .}} {{end}}
    </div>
  </div>
  <div class="add-character-error"></div>
</div>
{{ end }}
