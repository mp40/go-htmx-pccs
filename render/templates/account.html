{{ define "page" }}
<div class="page-div account-page">
  <h1>Account</h1>
  <div class="buttons">
    <button 
      hx-get="/account/sign-in" 
      hx-trigger="click"
      hx-target=".modal-div"
      hx-swap="outerHTML"
      class="page-button-grey"
      >
      Sign In
    </button>
    <button class="page-button-grey">Sign Up</button>
  </div>
  {{ template "modal" . }}
</div> 
{{ end }}

{{ define "modal" }}
<div class="modal-div"></div>
{{ end }}
