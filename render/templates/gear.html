{{ define "gear" }}
<div class="page-div gear-page">
  <h1>Gear</h1>
  {{ template "equipment" .}} {{ template "firearms" .}}
  <dialog id="firearm-card-dialog" class="dialog-modal firearm-card-dialog">
    <button commandfor="firearm-card-dialog" command="close">&times;</button>
    <div class="dialog-body">Loading…</div>
  </dialog>
</div>
{{ end }} {{ define "firearms" }}
<div class="firearms">
  <h2>Firearms</h2>
  <div class="firearms-list">
    {{range .Firearms}}
    <button
      command="show-modal"
      commandfor="firearm-card-dialog"
      hx-get="/gear/firearm/{{.ID}}"
      hx-target="#firearm-card-dialog .dialog-body"
    >
      <span>{{.Name}}</span>
      <span>{{.BaseWeight}}</span>
    </button>
    {{end}}
  </div>
</div>
{{ end }}
